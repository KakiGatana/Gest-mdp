<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b1020">
<meta name="color-scheme" content="dark">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Coffre">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="description" content="Gestionnaire de mots de passe chiffré, 100 % local.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<title>Coffre</title>
<style>
:root{--bg:#0b1020;--bg2:#131a33;--card:#161e3a;--line:#27315a;--txt:#e8ecff;--mut:#8b95c4;--acc:#6366f1;--acc2:#818cf8;--bad:#ef4444;--ok:#22c55e;
  --st:env(safe-area-inset-top,0px);--sb:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{background:var(--bg)}
body{margin:0;min-height:100vh;min-height:100dvh;color:var(--txt);font:16px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  background:radial-gradient(900px 500px at 50% -10%,#232d63 0%,transparent 70%),var(--bg);-webkit-font-smoothing:antialiased;overscroll-behavior-y:none}
.wrap{max-width:560px;margin:0 auto;padding:calc(18px + var(--st)) 16px calc(110px + var(--sb))}
h1{font-size:26px;font-weight:700;letter-spacing:-.02em;margin:6px 0 16px}
input,textarea,button{font:inherit;color:var(--txt)}
input,textarea{width:100%;padding:14px;background:var(--bg2);border:1px solid var(--line);border-radius:14px;margin-bottom:10px;outline:none;transition:border-color .15s,box-shadow .15s}
input:focus,textarea:focus{border-color:var(--acc2);box-shadow:0 0 0 3px #6366f133}
input[readonly]{opacity:.9}
button{background:linear-gradient(135deg,var(--acc),#4f46e5);border:0;border-radius:14px;padding:14px 18px;min-height:48px;font-weight:600;cursor:pointer;transition:transform .08s,opacity .15s}
button:active{transform:scale(.97)}
button.sec{background:var(--bg2);border:1px solid var(--line);font-weight:500}
button.bad{background:linear-gradient(135deg,#ef4444,#dc2626)}
button:disabled{opacity:.5}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px;margin-bottom:12px}
.row{display:flex;gap:8px;align-items:center}
.row>*{flex:1}
.row>button.sm{flex:none}
.row>input{margin-bottom:10px}
.mut{color:var(--mut);font-size:14px}
.err{color:#fca5a5;min-height:22px;font-size:14px}
.item{display:flex;align-items:center;gap:14px;cursor:pointer;padding:12px 14px}
.item:active{background:var(--bg2)}
.item .t{min-width:0}
.item b{display:block;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item .mut{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.av{flex:none;width:44px;height:44px;border-radius:14px;display:grid;place-items:center;font-weight:700;font-size:18px;color:#fff}
.top{display:flex;justify-content:space-between;align-items:center}
.logo{width:76px;height:76px;border-radius:22px;margin:24px auto 12px;display:block;box-shadow:0 12px 40px #6366f166}
.center{text-align:center}
.fab{position:fixed;right:max(18px,calc(50% - 262px));bottom:calc(20px + var(--sb));width:60px;height:60px;border-radius:20px;padding:0;font-size:30px;line-height:1;box-shadow:0 10px 30px #4f46e588;z-index:5}
.bar{height:5px;border-radius:3px;background:var(--line);overflow:hidden;margin:-2px 0 12px}
.bar i{display:block;height:100%;width:0;transition:width .2s,background .2s}
.toast{position:fixed;bottom:calc(96px + var(--sb));left:50%;transform:translate(-50%,10px);background:#16a34a;color:#fff;padding:11px 18px;border-radius:24px;opacity:0;transition:.25s;pointer-events:none;z-index:20;font-size:15px;white-space:nowrap}
.toast.on{opacity:1;transform:translate(-50%,0)}
.hidden{display:none}
label.f{display:block;font-size:13px;color:var(--mut);margin:6px 2px 6px}
.modal{position:fixed;inset:0;background:#02051099;backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);display:flex;align-items:flex-end;justify-content:center;z-index:10;animation:fade .2s}
.modal>div{background:var(--bg);border:1px solid var(--line);border-bottom:0;width:100%;max-width:560px;max-height:92vh;max-height:92dvh;overflow:auto;border-radius:26px 26px 0 0;padding:12px 18px calc(22px + var(--sb));animation:up .25s cubic-bezier(.2,.9,.3,1)}
.modal>div::before{content:"";display:block;width:40px;height:5px;border-radius:3px;background:var(--line);margin:0 auto 14px}
.tip{border:1px dashed var(--line);border-radius:14px;padding:12px 14px;margin-bottom:12px;font-size:14px;color:var(--mut)}
@keyframes fade{from{opacity:0}}
@keyframes up{from{transform:translateY(40px);opacity:.6}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="wrap" id="app"></div>
<div class="toast" id="toast"></div>

<script>
"use strict";
const LS = "coffre.v1";
const ITER = 600000;
const LOCK_MS = 2 * 60 * 1000;
const enc = new TextEncoder(), dec = new TextDecoder();
const b64 = b => btoa(String.fromCharCode(...new Uint8Array(b)));
const unb64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
const $ = (h) => { const t = document.createElement("template"); t.innerHTML = h.trim(); return t.content.firstChild; };
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

let key = null, salt = null, entries = [], lockTimer = null, clipTimer = null;

async function derive(pw, s) {
  const base = await crypto.subtle.importKey("raw", enc.encode(pw), "PBKDF2", false, ["deriveKey"]);
  return crypto.subtle.deriveKey({name:"PBKDF2", salt:s, iterations:ITER, hash:"SHA-256"}, base,
    {name:"AES-GCM", length:256}, false, ["encrypt","decrypt"]);
}
async function encrypt(k, obj) {
  const iv = crypto.getRandomValues(new Uint8Array(12));
  const ct = await crypto.subtle.encrypt({name:"AES-GCM", iv}, k, enc.encode(JSON.stringify(obj)));
  return {iv:b64(iv), ct:b64(ct)};
}
async function decrypt(k, iv, ct) {
  const p = await crypto.subtle.decrypt({name:"AES-GCM", iv:unb64(iv)}, k, unb64(ct));
  return JSON.parse(dec.decode(p));
}
async function save() {
  const {iv, ct} = await encrypt(key, entries);
  localStorage.setItem(LS, JSON.stringify({v:1, salt:b64(salt), iv, ct}));
}
const load = () => { try { return JSON.parse(localStorage.getItem(LS)); } catch { return null; } };

function toast(m) { const t = document.getElementById("toast"); t.textContent = m; t.classList.add("on"); setTimeout(() => t.classList.remove("on"), 1800); }
function app() { return document.getElementById("app"); }
function mount(node) { app().replaceChildren(node); }

function resetLock() {
  clearTimeout(lockTimer);
  if (key) lockTimer = setTimeout(lock, LOCK_MS);
}
["click","keydown","touchstart"].forEach(e => addEventListener(e, resetLock, {passive:true}));
// Verrouille si l'app reste en arrière-plan plus de 30 s (pas pendant le choix d'un fichier).
let hiddenAt = 0, picking = false;
document.addEventListener("visibilitychange", () => {
  if (document.hidden) hiddenAt = Date.now();
  else if (key && !picking && hiddenAt && Date.now() - hiddenAt > 30000) lock();
});

const hue = s => [...s].reduce((a, c) => (a * 31 + c.charCodeAt(0)) % 360, 7);
function strength(p) {
  let s = Math.min(p.length, 20) * 3;
  s += /[a-z]/.test(p) * 8 + /[A-Z]/.test(p) * 8 + /\d/.test(p) * 8 + /[^A-Za-z0-9]/.test(p) * 12;
  return Math.min(100, s);
}
const isIOS = /iphone|ipad|ipod/i.test(navigator.userAgent);
const standalone = matchMedia("(display-mode: standalone)").matches || navigator.standalone;

function lock() {
  key = null; entries = []; salt = null;
  document.querySelectorAll(".modal").forEach(m => m.remove());
  viewLogin();
}

/* ---------- Écrans ---------- */
function viewLogin() {
  const data = load();
  const first = !data;
  const tip = (!standalone && first) ? `<div class="tip">📲 Pour l'installer comme une app : ${isIOS
    ? "dans Safari, appuie sur <b>Partager</b> puis <b>Sur l'écran d'accueil</b>."
    : "menu du navigateur → <b>Installer l'application</b> / <b>Ajouter à l'écran d'accueil</b>."}</div>` : "";
  const n = $(`<div>
    <img class="logo" src="icons/icon-192.png" alt="">
    <h1 class="center">Coffre</h1>
    ${tip}
    <div class="card">
      <p class="mut" style="margin-top:0">${first
        ? "Crée ton mot de passe maître. Il n'est stocké nulle part : <b>si tu l'oublies, tes données sont perdues</b>."
        : "Entre ton mot de passe maître."}</p>
      <div class="row"><input id="pw" type="password" placeholder="Mot de passe maître" autocomplete="off" autocapitalize="off"><button type="button" class="sec sm" id="see" aria-label="Afficher">👁</button></div>
      ${first ? '<div class="bar"><i id="bar"></i></div><input id="pw2" type="password" placeholder="Confirme le mot de passe" autocomplete="off" autocapitalize="off">' : ""}
      <div class="err" id="err"></div>
      <button id="go" style="width:100%">${first ? "Créer le coffre" : "Déverrouiller"}</button>
      ${first ? '<p class="mut center" style="margin:16px 0 0">Déjà une sauvegarde ? <a href="#" id="imp" style="color:var(--acc2)">Importer</a></p>' : ""}
    </div></div>`);
  const err = n.querySelector("#err"), go = n.querySelector("#go"), pw = n.querySelector("#pw");
  n.querySelector("#see").onclick = () => {
    const t = pw.type === "password" ? "text" : "password";
    pw.type = t; const p2 = n.querySelector("#pw2"); if (p2) p2.type = t;
  };
  const bar = n.querySelector("#bar");
  if (bar) pw.oninput = () => {
    const s = strength(pw.value);
    bar.style.width = s + "%"; bar.style.background = s < 40 ? "#ef4444" : s < 70 ? "#f59e0b" : "#22c55e";
  };
  const submit = async () => {
    err.textContent = "";
    if (first) {
      const p2 = n.querySelector("#pw2").value;
      if (pw.value.length < 10) return err.textContent = "10 caractères minimum.";
      if (pw.value !== p2) return err.textContent = "Les mots de passe diffèrent.";
    }
    go.disabled = true; go.textContent = "…";
    try {
      if (first) {
        salt = crypto.getRandomValues(new Uint8Array(16));
        key = await derive(pw.value, salt); entries = []; await save();
      } else {
        const s = unb64(data.salt), k = await derive(pw.value, s);
        entries = await decrypt(k, data.iv, data.ct); key = k; salt = s;
      }
      resetLock(); viewList();
    } catch { err.textContent = "Mot de passe incorrect."; go.disabled = false; go.textContent = "Déverrouiller"; }
  };
  go.onclick = submit;
  n.addEventListener("keydown", e => { if (e.key === "Enter") submit(); });
  const imp = n.querySelector("#imp");
  if (imp) imp.onclick = e => { e.preventDefault(); pickImport(); };
  mount(n);
}

function viewList(q = "") {
  const n = $(`<div>
    <div class="top"><h1>Coffre</h1><button class="sec sm" id="menu" aria-label="Options">⋯</button></div>
    <input id="q" type="search" placeholder="Rechercher…" value="${esc(q)}">
    <div id="list"></div>
    <button class="fab" id="add" aria-label="Ajouter">＋</button></div>`);
  const list = n.querySelector("#list");
  const f = entries.filter(e => (e.site + e.user).toLowerCase().includes(q.toLowerCase()))
                   .sort((a, b) => a.site.localeCompare(b.site));
  if (!f.length) list.innerHTML = `<p class="mut">${entries.length ? "Aucun résultat." : "Aucun mot de passe. Appuie sur ＋ pour en ajouter."}</p>`;
  f.forEach(e => {
    const c = $(`<div class="card item"><div class="av" style="background:hsl(${hue(e.site)} 55% 45%)">${esc(e.site.trim()[0]?.toUpperCase() || "?")}</div><div class="t"><b>${esc(e.site)}</b><span class="mut">${esc(e.user) || "—"}</span></div></div>`);
    c.onclick = () => viewEntry(e);
    list.append(c);
  });
  const qi = n.querySelector("#q");
  qi.oninput = () => { viewList(qi.value); const i = document.getElementById("q"); i.focus(); i.setSelectionRange(i.value.length, i.value.length); };
  n.querySelector("#add").onclick = () => viewEdit();
  n.querySelector("#menu").onclick = viewMenu;
  mount(n);
}

function modal(inner) {
  const m = $(`<div class="modal"><div></div></div>`);
  m.firstChild.append(inner);
  m.onclick = e => { if (e.target === m) m.remove(); };
  document.body.append(m);
  return m;
}

function copy(text, label) {
  navigator.clipboard.writeText(text).then(() => {
    toast(label + " copié (effacé dans 30 s)");
    clearTimeout(clipTimer);
    clipTimer = setTimeout(() => navigator.clipboard.writeText("").catch(() => {}), 30000);
  }).catch(() => toast("Copie impossible"));
}

function viewEntry(e) {
  const n = $(`<div>
    <h1>${esc(e.site)}</h1>
    <label class="f">Identifiant</label>
    <div class="row"><input readonly value="${esc(e.user)}"><button class="sec sm" data-c="user">Copier</button></div>
    <label class="f">Mot de passe</label>
    <div class="row"><input readonly id="p" type="password" value="${esc(e.pass)}">
      <button class="sec sm" id="eye">👁</button><button class="sec sm" data-c="pass">Copier</button></div>
    ${e.notes ? `<label class="f">Notes</label><div class="card mut" style="white-space:pre-wrap">${esc(e.notes)}</div>` : ""}
    <div class="row" style="margin-top:12px"><button class="sec" id="edit">Modifier</button><button class="bad" id="del">Supprimer</button></div></div>`);
  const m = modal(n);
  n.querySelector("#eye").onclick = () => { const p = n.querySelector("#p"); p.type = p.type === "password" ? "text" : "password"; };
  n.querySelectorAll("[data-c]").forEach(b => b.onclick = () => copy(e[b.dataset.c], b.dataset.c === "pass" ? "Mot de passe" : "Identifiant"));
  n.querySelector("#edit").onclick = () => { m.remove(); viewEdit(e); };
  n.querySelector("#del").onclick = async () => {
    if (!confirm("Supprimer « " + e.site + " » ?")) return;
    entries = entries.filter(x => x.id !== e.id); await save(); m.remove(); viewList();
  };
}

function genPass(len = 20) {
  const set = "abcdefghijkmnopqrstuvwxyzABCDEFGHJKLMNPQRSTUVWXYZ23456789!@#$%^&*-_=+";
  const lim = 256 - (256 % set.length); let out = "";
  while (out.length < len) for (const b of crypto.getRandomValues(new Uint8Array(len))) if (b < lim && out.length < len) out += set[b % set.length];
  return out;
}

function viewEdit(e) {
  const n = $(`<div>
    <h1>${e ? "Modifier" : "Nouveau"}</h1>
    <label class="f">Site / app</label><input id="site" value="${esc(e?.site)}">
    <label class="f">Identifiant / email</label><input id="user" value="${esc(e?.user)}" autocapitalize="off">
    <label class="f">Mot de passe</label>
    <div class="row"><input id="pass" value="${esc(e?.pass)}" autocapitalize="off"><button class="sec sm" id="gen">Générer</button></div>
    <label class="f">Notes</label><textarea id="notes" rows="3">${esc(e?.notes)}</textarea>
    <div class="err" id="err"></div>
    <div class="row"><button class="sec" id="cancel">Annuler</button><button id="ok">Enregistrer</button></div></div>`);
  const m = modal(n);
  n.querySelector("#gen").onclick = () => n.querySelector("#pass").value = genPass();
  n.querySelector("#cancel").onclick = () => m.remove();
  n.querySelector("#ok").onclick = async () => {
    const v = id => n.querySelector("#" + id).value;
    if (!v("site").trim()) return n.querySelector("#err").textContent = "Le nom du site est requis.";
    const item = {id: e?.id ?? crypto.randomUUID(), site: v("site").trim(), user: v("user").trim(), pass: v("pass"), notes: v("notes")};
    entries = e ? entries.map(x => x.id === e.id ? item : x) : [...entries, item];
    await save(); m.remove(); viewList();
  };
}

function viewMenu() {
  const n = $(`<div><h1>Options</h1>
    <button class="sec" id="exp" style="width:100%;margin-bottom:8px">Exporter une sauvegarde chiffrée</button>
    <button class="sec" id="imp" style="width:100%;margin-bottom:8px">Importer une sauvegarde</button>
    <button class="sec" id="chg" style="width:100%;margin-bottom:8px">Changer le mot de passe maître</button>
    <button class="sec" id="lck" style="width:100%;margin-bottom:8px">Verrouiller</button>
    <p class="mut">Verrouillage auto après 2 min d'inactivité. ${entries.length} entrée(s).</p></div>`);
  const m = modal(n);
  n.querySelector("#lck").onclick = lock;
  n.querySelector("#exp").onclick = () => {
    const blob = new Blob([localStorage.getItem(LS)], {type:"application/json"});
    const a = document.createElement("a"); a.href = URL.createObjectURL(blob);
    a.download = "coffre-" + new Date().toISOString().slice(0, 10) + ".json"; a.click();
    setTimeout(() => URL.revokeObjectURL(a.href), 5000); m.remove();
  };
  n.querySelector("#imp").onclick = () => { m.remove(); pickImport(); };
  n.querySelector("#chg").onclick = async () => {
    const p = prompt("Nouveau mot de passe maître (10 caractères min) :");
    if (!p) return;
    if (p.length < 10) return alert("Trop court.");
    if (prompt("Confirme le nouveau mot de passe :") !== p) return alert("Ils ne correspondent pas.");
    salt = crypto.getRandomValues(new Uint8Array(16)); key = await derive(p, salt); await save();
    m.remove(); toast("Mot de passe maître changé");
  };
}

function pickImport() {
  const hadVault = !!load(); // si un coffre existe, on ne l'écrase jamais
  picking = true;
  const inp = document.createElement("input"); inp.type = "file"; inp.accept = ".json,application/json";
  inp.addEventListener("cancel", () => { picking = false; });
  inp.onchange = async () => {
    picking = false;
    if (hadVault && !key) return alert("Le coffre s'est verrouillé. Déverrouille-le puis réessaie.");
    try {
      const d = JSON.parse(await inp.files[0].text());
      if (!d.salt || !d.iv || !d.ct) throw 0;
      const p = prompt("Mot de passe maître de cette sauvegarde :"); if (!p) return;
      const imported = await decrypt(await derive(p, unb64(d.salt)), d.iv, d.ct);
      if (!key) { // coffre vide : on adopte la sauvegarde telle quelle
        localStorage.setItem(LS, JSON.stringify(d)); toast("Sauvegarde importée"); viewLogin();
      } else {
        const ids = new Set(entries.map(e => e.id));
        const add = imported.filter(e => !ids.has(e.id));
        entries = [...entries, ...add]; await save(); toast(add.length + " entrée(s) ajoutée(s)"); viewList();
      }
    } catch { alert("Fichier invalide ou mot de passe incorrect."); }
  };
  inp.click();
}

if (!crypto?.subtle) app().textContent = "Ce navigateur ne supporte pas le chiffrement (ouvre la page en HTTPS ou en fichier local).";
else viewLogin();

if ("serviceWorker" in navigator && location.protocol.startsWith("http")) {
  navigator.serviceWorker.register("sw.js").catch(() => {});
}
</script>
</body>
</html>
